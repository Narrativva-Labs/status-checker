name: Deploy edge functions

# Deploys the Supabase Edge Functions whenever they change on main.
# Needs the SUPABASE_ACCESS_TOKEN secret and the SUPABASE_PROJECT_ID variable;
# without them the job is skipped, so forks are not affected.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID is not configured, skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: denoland/setup-deno@v2
        if: steps.config.outputs.ready == 'true'
        with:
          deno-version: v2.x

      - name: Type-check
        if: steps.config.outputs.ready == 'true'
        run: deno check supabase/functions/*/index.ts

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: 3.0.0

      - name: Deploy
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy --remote="$SUPABASE_PROJECT_ID" --use-api --yes
