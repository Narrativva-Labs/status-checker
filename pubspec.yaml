name: status_checker
description: Uptime monitoring for custom URLs with daily status history and Discord alerts.
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  supabase_flutter: ^1.10.0
  url_launcher: ^6.2.5
  google_fonts: ^6.2.1
  intl: ^0.19.0
  font_awesome_flutter: ^11.0.0
  flex_color_scheme: ^8.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
